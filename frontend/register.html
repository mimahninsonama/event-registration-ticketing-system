<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Register for Event</title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

<header>

    <h1>Event Registration</h1>

    <nav>

        <a href="index.html">Home</a>
        <a href="events.html">Events</a>

    </nav>

</header>

<div class="container">

    <div class="card">

        <h2>Register</h2>

        <form id="registration-form">

            <label>Event ID</label>

            <input
                type="text"
                id="event_id"
                readonly
            >

            <label>Full Name</label>

            <input
                type="text"
                id="full_name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                id="email"
                required
            >

            <br><br>

            <button type="submit">

                Register

            </button>

        </form>

        <br>

        <div id="message"></div>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/register.js"></script>

</body>

</html>
