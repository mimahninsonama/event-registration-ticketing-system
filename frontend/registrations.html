<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Registrations | Event Registration System</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="site-header">

    <div class="header-inner">

        <a href="index.html" class="brand">
            <span class="brand-logo">ERS</span>
            <span class="brand-name">Event Registration System</span>
        </a>

        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="registrations.html" class="active">
                My Registrations
            </a>
        </nav>

    </div>

</header>


<main class="registrations-page">

    <section class="page-hero">

        <div class="page-hero-content">

            <span class="eyebrow">
                REGISTRATION MANAGEMENT
            </span>

            <h1>
                My Registrations
            </h1>

            <p>
                Search and manage your event registrations in one place.
            </p>

        </div>

    </section>


    <section class="registration-search">

        <div class="search-content">

            <div class="search-field">

                <label for="email">
                    Search by email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                >

            </div>

            <button
                type="button"
                class="primary-button"
                onclick="loadRegistrations()"
            >
                Search
            </button>

        </div>

    </section>


    <section class="registrations-results">

        <div id="registrations-container">

        </div>

    </section>

</main>


<footer class="site-footer">

    <div class="footer-inner">

        <span>
            © 2026 Event Registration System. All rights reserved.
        </span>

        <span>
            Built with AWS&nbsp; &bull; &nbsp;Serverless&nbsp; &bull; &nbsp;Terraform&nbsp; &bull; &nbsp;Scalable
        </span>

    </div>

</footer>


<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/registrations.js"></script>

</body>

</html>
